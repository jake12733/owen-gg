<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Owen.gg - 리그 오브 레전드 전적 검색</title>
<link rel="icon" type="image/webp" href="logo.webp">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#080b12;--bg2:#0d121c;--card:#111725;--card2:#161e2f;--line:#222b3e;--line2:#2b3650;--text:#e8ebf2;--sub:#8e97ab;--mute:#5d667b;--gold:#c8aa6e;--gold2:#f0d28c;--teal:#0ac8b9;--win:#3d7bff;--winbg:linear-gradient(90deg,rgba(61,123,255,.16),rgba(61,123,255,.05));--lose:#ef4561;--losebg:linear-gradient(90deg,rgba(239,69,97,.16),rgba(239,69,97,.05));--remake:#6b7280;--r:16px}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-color:#2b3650 transparent}
body{font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
img{display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.sub{color:var(--sub)}.mute{color:var(--mute)}
.d{color:var(--lose)}

/* top bar */
.topbar{position:sticky;top:0;z-index:60;height:62px;display:flex;align-items:center;gap:18px;padding:0 22px;background:rgba(8,11,18,.78);backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid rgba(255,255,255,.06)}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;letter-spacing:-.3px}
.logo-mark{width:34px;height:34px;border-radius:50%;background:#0b0f1a url(logo.webp) center/122% no-repeat;box-shadow:0 0 0 1px rgba(212,175,55,.45),0 0 18px rgba(212,175,55,.25);flex:0 0 auto}
.hero-logo{width:96px;height:96px;margin:0 auto 18px;border-radius:50%;background:#0b0f1a url(logo.webp) center/122% no-repeat;box-shadow:0 0 0 1px rgba(212,175,55,.5),0 10px 40px rgba(212,175,55,.22)}
.logo-mark i{width:12px;height:12px;border:3px solid #080b12;border-radius:50%}
.logo b{background:linear-gradient(120deg,#fff,#f0d28c 60%,#0ac8b9);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;gap:4px}
.nav a{color:var(--sub);font-weight:600;padding:8px 13px;border-radius:9px;transition:.15s}
.nav a:hover,.nav a.on{color:var(--text);background:rgba(255,255,255,.06)}
.top-search{flex:1;max-width:440px;margin-left:auto}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--sub);transition:.15s}
.icon-btn:hover{background:rgba(255,255,255,.07);color:var(--text)}
.icon-btn svg{width:20px;height:20px}

/* search */
.sform{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;height:42px;transition:.2s;position:relative}
.sform:focus-within{border-color:var(--teal);box-shadow:0 0 0 4px rgba(10,200,185,.12)}
.sform select{appearance:none;background:transparent;border:0;outline:0;padding:0 26px 0 14px;height:100%;font-weight:700;font-size:13px;color:var(--gold2);cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 13px) 18px,calc(100% - 9px) 18px;background-size:4px 4px;background-repeat:no-repeat;border-right:1px solid var(--line)}
.sform select option{background:var(--card);color:var(--text)}
.sform input{flex:1;min-width:0;background:transparent;border:0;outline:0;padding:0 12px;height:100%}
.sform input::placeholder{color:var(--mute)}
.sform button{height:100%;padding:0 14px;color:var(--sub)}
.sform button:hover{color:var(--teal)}
.sform button svg{width:19px;height:19px;display:block}
.sform.big{height:62px;border-radius:18px;background:rgba(17,23,37,.85);backdrop-filter:blur(10px);border-color:rgba(255,255,255,.1)}
.sform.big select{font-size:15px;padding:0 34px 0 22px;background-position:calc(100% - 18px) 28px,calc(100% - 13px) 28px}
.sform.big input{font-size:17px;padding:0 18px}
.sform.big button{padding:0 22px}.sform.big button svg{width:24px;height:24px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 16px;border-radius:10px;font-weight:700;font-size:13px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);transition:.15s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.primary{background:linear-gradient(135deg,#0ac8b9,#0a9e93);border-color:transparent;color:#03201d}
.btn.primary:hover{filter:brightness(1.1)}
.btn.gold{background:linear-gradient(135deg,#f0d28c,#c8aa6e);color:#2a1f08;border-color:transparent}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px}
.btn.on{color:var(--gold2);border-color:rgba(240,210,140,.4)}

/* home */
.hero{position:relative;min-height:calc(100vh - 62px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px 80px;overflow:hidden}
.hero-bg{position:absolute;inset:0;z-index:-1}
.hero-bg div{position:absolute;inset:-30px;background-size:cover;background-position:center 20%;opacity:0;transition:opacity 1.6s;filter:saturate(1.1)}
.hero-bg div.on{opacity:.35}
.hero-bg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s;filter:saturate(1.1)}
.hero-bg video.on{opacity:1}
.hero-bg.vid-on div{opacity:0!important}
.hero-bg:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(8,11,18,.5),rgba(8,11,18,.18) 70%),linear-gradient(180deg,rgba(8,11,18,0) 65%,var(--bg))}
.hero h1{font-size:clamp(44px,8vw,86px);font-weight:900;letter-spacing:-3px;line-height:1;text-align:center}
.hero h1 b{background:linear-gradient(120deg,#fff 10%,#f0d28c 55%,#0ac8b9);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.tag{color:var(--sub);font-size:17px;margin:16px 0 36px;text-align:center}
.hero .sform{width:min(680px,100%)}
.hero-hint{margin-top:12px;color:var(--mute);font-size:13px}
.hero-hint kbd{background:rgba(255,255,255,.08);padding:1px 6px;border-radius:5px;font-family:inherit;color:var(--sub)}
.home-row{width:min(680px,100%);margin-top:28px}
.home-row h3{font-size:13px;color:var(--sub);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.rchip{display:flex;align-items:center;gap:9px;background:rgba(17,23,37,.8);border:1px solid var(--line);border-radius:12px;padding:6px 10px 6px 6px;transition:.15s}
.rchip:hover{border-color:var(--line2);background:var(--card2)}
.rchip img{width:28px;height:28px;border-radius:8px}
.rchip b{font-size:13px}.rchip span{font-size:12px;color:var(--mute)}
.rchip .x{color:var(--mute);padding:0 2px 0 4px;font-size:15px}
.rchip .x:hover{color:var(--lose)}
.notice{margin-top:26px;width:min(680px,100%);display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:14px;background:rgba(240,210,140,.07);border:1px solid rgba(240,210,140,.2);font-size:13px;color:#e9d8ae}
.notice .btn{margin-left:auto}
.rot{display:flex;flex-wrap:wrap;gap:6px}
.rot img{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);transition:.15s}
.rot img:hover{transform:translateY(-2px);border-color:var(--gold)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-weight:800;font-size:14px;border-bottom:1px solid var(--line)}
.card-h .sub{font-weight:500;font-size:12px}

/* profile banner */
.pbanner{position:relative;padding:44px 0 34px;overflow:hidden;border-bottom:1px solid var(--line)}
.pbanner:before{content:"";position:absolute;inset:0;background:var(--splash) center 22%/cover no-repeat;opacity:.32;filter:saturate(1.15)}
.pbanner:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 18%,rgba(8,11,18,.55) 60%,rgba(8,11,18,.85)),linear-gradient(0deg,var(--bg),transparent 70%)}
.pb-in{position:relative;z-index:1;display:flex;gap:26px;align-items:center}
.picon{position:relative;flex:none}
.picon img{width:112px;height:112px;border-radius:28px;border:3px solid rgba(240,210,140,.7);box-shadow:0 10px 40px rgba(0,0,0,.5)}
.picon span{position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);background:#0d121c;border:1px solid rgba(240,210,140,.6);color:var(--gold2);font-size:12px;font-weight:800;padding:2px 10px;border-radius:20px}
.ptags{display:flex;gap:6px;margin-bottom:8px}
.chip{font-size:11px;font-weight:800;padding:4px 9px;border-radius:7px;background:rgba(255,255,255,.08);color:var(--sub);letter-spacing:.3px}
.chip.tier{color:var(--tc);background:color-mix(in srgb,var(--tc) 14%,transparent)}
.chip.demo{background:rgba(240,210,140,.15);color:var(--gold2)}
.pinfo h1{font-size:34px;font-weight:900;letter-spacing:-.8px;line-height:1.15}
.pinfo h1 span{color:var(--sub);font-weight:600;font-size:24px;margin-left:6px}
.pact{display:flex;gap:8px;margin-top:16px}
.upd{margin-top:10px;color:var(--mute);font-size:12px}

/* profile grid */
.pgrid{display:grid;grid-template-columns:330px 1fr;gap:16px;padding-top:18px;padding-bottom:80px;align-items:start}
.pside{display:flex;flex-direction:column;gap:12px}
.pmain{display:flex;flex-direction:column;gap:10px;min-width:0}

/* rank card */
.rank-body{display:flex;align-items:center;gap:14px;padding:16px}
.emb{width:84px;height:84px;flex:none;position:relative;display:grid;place-items:center}
.emb img{width:210%;height:210%;object-fit:contain;position:absolute;filter:drop-shadow(0 4px 14px color-mix(in srgb,var(--tc) 40%,transparent))}
.emb .fb{width:64px;height:64px;border-radius:50%;border:4px solid var(--tc);display:grid;place-items:center;font-weight:900;color:var(--tc);font-size:22px}
.rank-t{flex:1}
.rank-t b{font-size:19px;font-weight:900;color:var(--tc);display:block}
.rank-t .lp{color:var(--sub);font-size:13px;margin-top:2px}
.rank-t .wl{color:var(--mute);font-size:12px;margin-top:6px}
.unranked{display:flex;align-items:center;gap:14px;padding:16px;color:var(--mute)}
.unranked .q{width:56px;height:56px;border-radius:50%;border:3px dashed var(--line2);display:grid;place-items:center;font-weight:900;font-size:20px}
.unranked b{color:var(--sub);display:block;font-size:15px}
.ring text{fill:var(--text);font-size:14px;font-weight:800}
.hot{font-size:11px;color:#ff8a4c;background:rgba(255,138,76,.12);padding:3px 8px;border-radius:6px}

/* side lists */
.clist .row{display:grid;grid-template-columns:36px 1fr 74px 50px;gap:10px;align-items:center;padding:9px 16px;border-bottom:1px solid rgba(255,255,255,.04)}
.clist .row:last-child{border:0}
.clist img{width:36px;height:36px;border-radius:10px}
.clist .nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clist .s2{font-size:11px;color:var(--mute);margin-top:2px}
.clist .kd{text-align:center;font-size:12px;font-weight:800}
.clist .kd small{display:block;font-weight:500;color:var(--mute);font-size:11px}
.clist .wr{text-align:right;font-size:12px;font-weight:800}
.clist .wr small{display:block;font-weight:500;color:var(--mute);font-size:11px}
.k3{color:#0ac8b9!important}.k4{color:#3d9bff!important}.k5{color:#ff8a4c!important}
.wr-hi{color:#ef4561!important}
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:14px 16px 16px}
.mc{text-align:center}
.mc .mi{position:relative;margin-bottom:12px}
.mc img{width:100%;aspect-ratio:1;border-radius:12px;border:2px solid var(--line2)}
.mc .ml{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);background:#0d121c;border:1px solid var(--gold);color:var(--gold2);font-size:10px;font-weight:800;padding:0 6px;border-radius:10px;line-height:16px}
.mc .mp{font-size:11px;color:var(--sub);font-weight:600}
.duo .row{display:grid;grid-template-columns:1fr 50px 64px;align-items:center;padding:9px 16px;gap:8px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.04)}
.duo .row:last-child{border:0}
.duo a{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.duo a:hover{color:var(--teal)}
.duo .c{text-align:center;color:var(--sub)}.duo .w{text-align:right;font-weight:800}
.empty{padding:26px 16px;text-align:center;color:var(--mute);font-size:13px}
.empty.big{padding:60px 16px;font-size:15px}

/* summary */
.qtabs{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--line);overflow-x:auto}
.qtab{padding:9px 14px;border-radius:10px;font-weight:700;font-size:13px;color:var(--sub);white-space:nowrap}
.qtab:hover{color:var(--text)}
.qtab.on{background:rgba(10,200,185,.12);color:var(--teal)}
.sum-grid{display:grid;grid-template-columns:1.1fr 1.3fr 1fr;gap:6px;padding:18px}
.sum-wr{display:flex;align-items:center;gap:16px}
.sum-wr .g{font-size:12px;color:var(--sub)}
.sum-kda{font-size:18px;font-weight:900;margin:4px 0 2px}
.sum-r{font-size:22px;font-weight:900}
.sub-h{font-size:12px;color:var(--sub);font-weight:700;margin-bottom:10px}
.sc{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12px}
.sc img{width:30px;height:30px;border-radius:50%}
.sc b{font-weight:800}
.sc .s2{color:var(--mute)}
.pos-bars{display:flex;gap:12px;align-items:flex-end;height:96px}
.pb{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}
.pb-track{width:14px;height:64px;border-radius:7px;background:rgba(255,255,255,.06);display:flex;align-items:flex-end;overflow:hidden}
.pb-fill{width:100%;background:linear-gradient(180deg,#0ac8b9,#0a7f97);border-radius:7px}
.pb img{width:20px;height:20px;opacity:.85}
.pb small{font-size:10px;color:var(--mute)}

/* match */
.match{display:grid;grid-template-columns:112px 1fr 230px 40px;align-items:stretch;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.05);position:relative;transition:transform .15s,border-color .15s;cursor:pointer;animation:rise .35s both}
.match:hover{border-color:rgba(255,255,255,.14)}
.match.win{background:var(--winbg),var(--card)}
.match.lose{background:var(--losebg),var(--card)}
.match.remake{background:var(--card)}
.match:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--mc)}
.match.win{--mc:var(--win)}.match.lose{--mc:var(--lose)}.match.remake{--mc:var(--remake)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.m-meta{padding:14px 10px 14px 20px;font-size:12px;color:var(--sub);display:flex;flex-direction:column;justify-content:center;gap:2px}
.m-meta .q{font-weight:800;color:var(--mc);font-size:12.5px}
.m-meta hr{border:0;border-top:1px solid rgba(255,255,255,.08);width:48px;margin:7px 0}
.m-meta .res{font-weight:800;color:var(--text)}
.m-main{padding:12px 8px;display:flex;flex-direction:column;justify-content:center;gap:8px;min-width:0}
.m-top{display:flex;align-items:center;gap:8px}
.mch{position:relative;flex:none}
.mch img{width:54px;height:54px;border-radius:50%;border:2px solid rgba(255,255,255,.1)}
.mch span{position:absolute;right:-3px;bottom:-3px;background:#0d121c;border:1px solid var(--line2);font-size:10px;font-weight:800;width:20px;height:20px;border-radius:50%;display:grid;place-items:center}
.ss{display:grid;grid-template-columns:repeat(2,24px);grid-template-rows:repeat(2,24px);gap:3px;flex:none}
.ss img{width:24px;height:24px;border-radius:6px;background:#0005}
.ss img.rn{border-radius:50%;background:#000a;padding:1px}
.ss img.rs{padding:4px}
.kda{width:120px;text-align:center;flex:none}
.kda .n{font-size:16px;font-weight:900;letter-spacing:.2px}
.kda .n i{font-style:normal;color:var(--mute);font-weight:500;margin:0 3px}
.kda .r{font-size:12px;color:var(--sub);margin-top:2px;font-weight:600}
.mstats{font-size:12px;color:var(--sub);line-height:1.6;border-left:1px solid rgba(255,255,255,.07);padding-left:12px;white-space:nowrap}
.mstats b{color:var(--text);font-weight:700}
.m-bottom{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.items{display:flex;gap:3px}
.it{width:26px;height:26px;border-radius:6px;background:rgba(0,0,0,.28);flex:none}
.it.ward{border-radius:50%;margin-left:3px}
.badge{font-size:11px;font-weight:800;padding:3px 8px;border-radius:20px;white-space:nowrap}
.b-mvp{background:linear-gradient(135deg,#f0d28c,#c8aa6e);color:#2a1f08}
.b-ace{background:#7c5cff;color:#fff}
.b-multi{background:rgba(239,69,97,.18);color:#ff6b84}
.b-penta{background:linear-gradient(135deg,#ff4e50,#f9d423);color:#2a0b0b}
.m-players{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;padding:10px 6px;align-content:center;min-width:0}
.mp-row{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--sub);height:19px;min-width:0}
.mp-row img{width:16px;height:16px;border-radius:4px;flex:none}
.mp-row a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-row a:hover{color:var(--text);text-decoration:underline}
.mp-row.me a{color:var(--text);font-weight:800}
.m-exp{display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px;background:rgba(255,255,255,.03);color:var(--sub)}
.m-exp svg{width:18px;height:18px;transition:.2s}
.match.open .m-exp svg{transform:rotate(180deg)}
.match.open{border-bottom-left-radius:0;border-bottom-right-radius:0}

/* detail */
.m-detail{background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;margin-top:-10px;padding:12px;animation:rise .25s both}
.dtabs{display:flex;gap:4px;margin-bottom:10px}
.dtab{padding:7px 14px;border-radius:9px;font-size:12px;font-weight:700;color:var(--sub);background:rgba(255,255,255,.04)}
.dtab.on{background:rgba(10,200,185,.12);color:var(--teal)}
.tt{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:10px;border-radius:12px;overflow:hidden}
.tt th{text-align:left;font-weight:700;color:var(--sub);padding:9px 8px;background:rgba(255,255,255,.03);font-size:11.5px;white-space:nowrap}
.tt th:first-child{font-size:12.5px}
.tt th.w{color:var(--win)}.tt th.l{color:var(--lose)}
.tt td{padding:6px 8px;border-top:1px solid rgba(255,255,255,.04);white-space:nowrap}
.tt tr.win td{background:rgba(61,123,255,.06)}.tt tr.lose td{background:rgba(239,69,97,.06)}
.tt tr.me td{background:rgba(240,210,140,.08)}
.tp{display:flex;align-items:center;gap:6px}
.tp .mch img{width:34px;height:34px}
.tp .mch span{width:16px;height:16px;font-size:9px}
.tp .ss{grid-template-columns:repeat(2,16px);grid-template-rows:repeat(2,16px);gap:2px}
.tp .ss img{width:16px;height:16px;border-radius:4px}
.tp .ss img.rs{padding:2px}
.tp .nm{max-width:118px;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.tp .nm:hover{color:var(--teal)}
.tp .tg{font-size:10.5px;color:var(--mute)}
.score{display:inline-flex;align-items:center;gap:5px;font-weight:800}
.score em{font-style:normal;font-size:10px;padding:1px 6px;border-radius:10px;background:rgba(255,255,255,.08);color:var(--sub)}
.score em.mvp{background:linear-gradient(135deg,#f0d28c,#c8aa6e);color:#2a1f08}
.score em.ace{background:#7c5cff;color:#fff}
.dmg{min-width:90px}
.dmg .v{font-size:11px;margin-bottom:3px}
.dmg .bars{display:flex;flex-direction:column;gap:2px}
.dmg .bar{height:5px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden}
.dmg .bar i{display:block;height:100%;background:var(--lose);border-radius:3px}
.dmg .bar.t i{background:#6b7c99}
.tt .items .it{width:22px;height:22px;border-radius:5px}
.obj{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 12px;margin-bottom:10px;border-radius:12px;background:rgba(255,255,255,.03);font-size:12px}
.obj .side{display:flex;gap:12px;align-items:center}
.obj .side span{display:flex;align-items:center;gap:4px;color:var(--sub)}
.obj .side svg{width:15px;height:15px}
.obj .side b{color:var(--text)}
.obj .mid{flex:1;max-width:420px}
.cmp{display:flex;align-items:center;gap:8px;font-size:11px;margin:2px 0}
.cmp .lab{width:56px;text-align:center;color:var(--sub)}
.cmp .track{flex:1;display:flex;height:16px;border-radius:5px;overflow:hidden;font-size:10.5px;font-weight:800}
.cmp .track i{display:flex;align-items:center;padding:0 7px;font-style:normal;color:#fff}
.cmp .track i.b{background:var(--win)}.cmp .track i.r{background:var(--lose);justify-content:flex-end}
.ana{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ana .box{background:rgba(255,255,255,.03);border-radius:12px;padding:14px}
.ana .box h4{font-size:12px;color:var(--sub);margin-bottom:10px}
.hb{display:grid;grid-template-columns:24px 1fr 56px;gap:8px;align-items:center;margin-bottom:6px;font-size:11px}
.hb img{width:24px;height:24px;border-radius:6px}
.hb .track{height:10px;background:rgba(255,255,255,.06);border-radius:5px;overflow:hidden}
.hb .track i{display:block;height:100%;border-radius:5px}
.hb .v{text-align:right;color:var(--sub)}

.more{width:100%;height:46px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:800;color:var(--sub);transition:.15s}
.more:hover{color:var(--text);border-color:var(--line2)}

/* skeleton */
.sk{background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:12px}
@keyframes sh{to{background-position:-200% 0}}
.sk-match{height:112px;border-radius:14px}
.spin{width:30px;height:30px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--teal);border-radius:50%;animation:rot .8s linear infinite;margin:0 auto}
@keyframes rot{to{transform:rotate(360deg)}}
.center{padding:60px 20px;text-align:center}

/* error */
.err{max-width:520px;margin:80px auto;text-align:center;padding:40px 28px}
.err .ic{width:64px;height:64px;border-radius:50%;background:rgba(239,69,97,.12);color:var(--lose);display:grid;place-items:center;margin:0 auto 18px;font-size:30px;font-weight:900}
.err h2{font-size:20px;margin-bottom:8px}
.err p{color:var(--sub);line-height:1.6;margin-bottom:20px}
.err .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* ranking */
.rk-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:30px 0 16px;flex-wrap:wrap}
.rk-head h2{font-size:28px;font-weight:900;letter-spacing:-.6px}
.rk-head .sub{margin-top:4px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{padding:7px 13px;border-radius:8px;font-size:13px;font-weight:700;color:var(--sub)}
.seg button.on{background:rgba(10,200,185,.14);color:var(--teal)}
.sel{background:var(--card);border:1px solid var(--line);border-radius:11px;height:38px;padding:0 12px;font-weight:700;outline:0}
.rk-ctrl{display:flex;gap:8px;flex-wrap:wrap}
.rk{width:100%;border-collapse:collapse}
.rk th{font-size:12px;color:var(--sub);text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700}
.rk td{padding:11px 16px;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px}
.rk tr:hover td{background:rgba(255,255,255,.02)}
.rk .no{font-weight:900;width:60px;color:var(--sub)}
.rk tr:nth-child(1) .no{color:#f0d28c}.rk tr:nth-child(2) .no{color:#c7d2e0}.rk tr:nth-child(3) .no{color:#d79b6a}
.rk .who a{font-weight:800}.rk .who a:hover{color:var(--teal)}
.rk .who .tg{color:var(--mute);margin-left:4px;font-size:12px}
.rk .lp{font-weight:800;color:var(--gold2)}
.wrbar{display:flex;align-items:center;gap:10px}
.wrbar .track{width:140px;height:18px;border-radius:5px;overflow:hidden;display:flex;font-size:10.5px;font-weight:800}
.wrbar .track i{display:flex;align-items:center;padding:0 6px;font-style:normal}
.wrbar .track i.w{background:var(--win)}.wrbar .track i.l{background:var(--lose);justify-content:flex-end;flex:1}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(3,5,10,.7);backdrop-filter:blur(6px);z-index:100;display:grid;place-items:center;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--bg2);border:1px solid var(--line2);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:rise .25s}
.modal.wide{width:min(980px,100%)}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);font-weight:900;font-size:17px;position:sticky;top:0;background:var(--bg2);z-index:1}
.modal-b{padding:22px}
.field{display:flex;gap:8px;margin:14px 0}
.field input{flex:1;height:44px;border-radius:11px;background:var(--card);border:1px solid var(--line);padding:0 14px;outline:0}
.field input:focus{border-color:var(--teal)}
.steps{margin:6px 0 0 18px;color:var(--sub);line-height:1.9;font-size:13px}
.steps a{color:var(--teal);text-decoration:underline}
.msg{margin-top:10px;font-size:13px;font-weight:700}
.msg.ok{color:#2fd27a}.msg.bad{color:var(--lose)}
.stat{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--lose)}.dot.on{background:#2fd27a;box-shadow:0 0 8px #2fd27a}

/* live */
.live-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:13px;color:var(--sub)}
.live-h b{color:var(--text)}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--lose);animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(239,69,97,0)}0%{box-shadow:0 0 0 0 rgba(239,69,97,.6)}}
.live-teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lt{border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.lt h4{padding:10px 14px;font-size:13px}
.lt.b h4{background:rgba(61,123,255,.14);color:#86aaff}.lt.r h4{background:rgba(239,69,97,.14);color:#ff8ea0}
.lp-row{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid rgba(255,255,255,.04);font-size:13px}
.lp-row img.c{width:38px;height:38px;border-radius:10px}
.lp-row .ss{grid-template-columns:repeat(2,18px);grid-template-rows:repeat(2,18px);gap:2px}
.lp-row .ss img{width:18px;height:18px}
.lp-row a{font-weight:700}.lp-row a:hover{color:var(--teal)}
.lp-row.me{background:rgba(240,210,140,.08)}
.bans{display:flex;gap:4px;padding:8px 14px;border-top:1px solid rgba(255,255,255,.04);align-items:center;font-size:11px;color:var(--mute)}
.bans img{width:24px;height:24px;border-radius:6px;filter:grayscale(1) brightness(.7)}

/* tooltip */
#tip{position:fixed;z-index:200;pointer-events:none;max-width:280px;background:#05070c;border:1px solid var(--line2);border-radius:10px;padding:9px 11px;font-size:12px;line-height:1.5;color:var(--sub);opacity:0;transition:opacity .12s;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#tip b{color:var(--gold2);display:block;font-size:12.5px}
#tip.on{opacity:1}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#05070c;border:1px solid var(--line2);padding:12px 18px;border-radius:12px;font-weight:700;font-size:13px;z-index:300;animation:rise .25s}

footer{border-top:1px solid var(--line);padding:26px 20px;text-align:center;color:var(--mute);font-size:12px;line-height:1.7}


/* titles (칭호) */
.ttl{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:3px 9px 3px 7px;border-radius:20px;white-space:nowrap;line-height:1.3;position:relative;overflow:hidden}
.ttl svg{width:12px;height:12px;flex:none}
.ttl.leg{background:linear-gradient(135deg,#ffe08a,#ffb547 55%,#ff7a3d);color:#3a1a00;box-shadow:0 0 14px rgba(255,170,60,.35)}
.ttl.leg:after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);animation:shine 2.8s infinite}
@keyframes shine{0%{left:-60%}55%,100%{left:130%}}
.ttl.epic{background:linear-gradient(135deg,#a77bff,#6a43e0);color:#fff;box-shadow:0 0 12px rgba(140,90,255,.3)}
.ttl.rare{background:rgba(10,200,185,.12);color:#4fe6d6;box-shadow:inset 0 0 0 1px rgba(10,200,185,.38)}
.ttl.more{background:rgba(255,255,255,.07);color:var(--sub);padding:3px 8px}
.ttl.sm{font-size:10px;padding:2px 7px 2px 5px;margin-top:3px}
.ttl.sm svg{width:10px;height:10px}
.m-titles{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.match.legend{border-color:rgba(255,190,90,.55);box-shadow:0 0 0 1px rgba(255,190,90,.2),0 0 26px rgba(255,160,50,.13)}
.match.legend:hover{border-color:rgba(255,200,110,.85)}
.ptitle{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--sub)}
.tcol{display:flex;flex-direction:column;gap:2px;padding:10px 12px 14px}
.tcol .tr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 4px;border-radius:8px}
.tcol .tr:hover{background:rgba(255,255,255,.03)}
.tcol .tr span{font-size:12px;color:var(--sub);font-weight:700}
.tcol .tsum{display:flex;gap:6px;padding:0 4px 8px;font-size:11.5px;color:var(--mute)}
.tcol .tsum b{color:var(--text)}
/* recent form */
.form-row{display:grid;grid-template-columns:1.1fr 1.3fr 1fr;gap:6px;padding:16px 18px 18px;border-top:1px solid var(--line)}
.streak{font-size:15px;font-weight:900;margin-bottom:10px}
.streak.w{color:#5b93ff}.streak.l{color:#ff6b84}.streak.n{color:var(--sub)}
.wl-strip{display:flex;gap:3px;flex-wrap:wrap}
.wl-strip i{width:14px;height:14px;border-radius:4px;font-style:normal;font-size:9px;font-weight:800;display:grid;place-items:center;color:#fff}
.wl-strip i.w{background:var(--win)}.wl-strip i.l{background:var(--lose)}
.spark{width:100%;height:74px;display:block}
.spark-lg{display:flex;gap:12px;font-size:11px;color:var(--mute);margin-top:4px}
.ptags2{display:flex;flex-wrap:wrap;gap:6px}
.ptags2 span{font-size:12px;font-weight:700;padding:5px 10px;border-radius:9px;background:rgba(240,210,140,.08);color:var(--gold2);box-shadow:inset 0 0 0 1px rgba(240,210,140,.2)}
/* champion filter */
#side-champs .row[data-cf]{cursor:pointer;transition:background .15s}
#side-champs .row[data-cf]:hover{background:rgba(255,255,255,.04)}
#side-champs .row.on{background:rgba(10,200,185,.1);box-shadow:inset 3px 0 0 var(--teal)}
.cf-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:rgba(10,200,185,.08);border:1px solid rgba(10,200,185,.25);font-size:13px}
.cf-bar img{width:26px;height:26px;border-radius:50%}
.cf-bar button{margin-left:auto;font-size:12px;font-weight:700;color:var(--teal)}
@media (max-width:980px){
  .form-row{grid-template-columns:1fr 1fr}.form-row>.ftags{grid-column:1/-1}
  .pgrid{grid-template-columns:1fr}
  .match{grid-template-columns:92px 1fr 36px}
  .m-players{display:none}
  .sum-grid{grid-template-columns:1fr 1fr}.sum-pos{display:none}
  .top-search{display:none}
  .ana{grid-template-columns:1fr}
  .live-teams{grid-template-columns:1fr}
  .m-detail{overflow-x:auto}
}
@media (max-width:620px){
  .pb-in{flex-direction:column;align-items:flex-start;gap:18px}
  .pinfo h1{font-size:26px}
  .mstats{display:none}
  .sum-grid{grid-template-columns:1fr}
  .form-row{grid-template-columns:1fr}
  .kda{width:92px}
  .nav{display:none}
}
#key-banner{position:sticky;top:0;z-index:60;padding:10px 18px;text-align:center;font-size:13.5px;line-height:1.5}
#key-banner.bad{background:linear-gradient(90deg,#3a1218,#4a1a20);color:#ffd6d9;border-bottom:1px solid #a33a45}
#key-banner.warn{background:linear-gradient(90deg,#3a2d10,#4a3a14);color:#ffe9b8;border-bottom:1px solid #a8862f}
#key-banner a{color:#fff;font-weight:800;text-decoration:underline;margin:0 6px}
.keybox{margin:12px 0 2px;padding:11px 14px;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:rgba(255,255,255,.03);font-size:13.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dot.warn{background:#f0b232;box-shadow:0 0 8px #f0b232}.dot.bad{background:#e8505b;box-shadow:0 0 8px #e8505b}
.clip-opt{display:flex;gap:9px;align-items:flex-start;margin-top:14px;font-size:13px;color:var(--sub,#a9b1c2);cursor:pointer}
.clip-opt input{margin-top:2px;width:16px;height:16px;accent-color:#0ac8b9}
.clip-opt b{color:var(--text,#fff)}
</style>

      kills: k, deaths: d, assists: a, totalMinionsKilled: pos === 'JUNGLE' ? Math.round(cs * .25) : cs, neutralMinionsKilled: pos === 'JUNGLE' ? Math.round(cs * .75) : 0,
      goldEarned: Math.round(min * (pos === 'UTILITY' ? 290 : 420) * (.85 + r() * .3) + (win ? 1500 : 0) + k * 250),
      totalDamageDealtToChampions: Math.round((pos === 'UTILITY' ? 480 : pos === 'TOP' || pos === 'JUNGLE' ? 780 : 950) * min * sk * (.6 + r() * .8) * (aram ? 1.6 : 1)),

      visionScore: vis, wardsPlaced: Math.round(vis * .45), wardsKilled: Math.round(vis * .12), detectorWardsPlaced: aram ? 0 : Math.round(r() * (pos === 'UTILITY' ? 8 : 3)),
      item0: its[0], item1: its[1], item2: its[2], item3: its[3], item4: its[4], item5: its[5], item6: aram ? 0 : pos === 'UTILITY' ? 3364 : 3340,
      summoner1Id: 4, summoner2Id: SPELL[pos] || 32,
      perks: { styles: [{ style: st.id, selections: [{ perk: pick(st.slots[0].runes, r).id }] }, { style: sub.id, selections: [] }] },
      teamId: team, win: remake ? false : win, teamPosition: pos, largestMultiKill: lm, pentaKills: lm === 5 ? 1 : 0, gameEndedInEarlySurrender: !!remake,
      firstBloodKill: k > 0 && r() < .1, largestKillingSpree: Math.max(0, Math.round(k * (.3 + r() * .5))), turretKills: Math.round((pos === 'TOP' ? 2 : pos === 'BOTTOM' || pos === 'MIDDLE' ? 1.3 : .5) * (win ? 1.4 : .6) * r() * 2.2),

  }

  function genMatch(id, puuid, h, i) {
    const r = rng(h * 13 + i * 7919 + 1), q = qOf(h, i), aram = q === 450;
    const remake = r() < .025;
    const dur = remake ? 190 + Math.floor(r() * 60) : Math.floor((aram ? 900 : 1250) + r() * 900);
    const end = Date.now() - (i * 2.6 + r() * 1.4) * 3600e3 - (h % 50) * 60e3;
    const meSlot = Math.floor(r() * 10), meWin = r() < .56, meTeam = meSlot < 5 ? 100 : 200, blueWin = meTeam === 100 ? meWin : !meWin;
    let cs = shuffle(DD.champList, r).slice(0, 10);
    const m = mains[puuid];
    if (m && r() < .65) { const main = DD.champs[pick(m.slice(0, 5), r)]; if (main) { cs = cs.filter(c => c !== main); cs.splice(meSlot, 0, main); cs = cs.slice(0, 10); } }
    const [mn, mt] = split(puuid);
    const ps = cs.map((c, s) => { const team = s < 5 ? 100 : 200; const isMe = s === meSlot; const nm = isMe ? mn : rname(r), tg = isMe ? mt : rtag(r); return genPlayer(r, { puuid: isMe ? puuid : `demo:${nm}#${tg}`, nm, tg, c, team, pos: aram ? '' : POSL[s % 5], win: team === 100 ? blueWin : !blueWin, min: dur / 60, aram, remake }); });
    const teams = [100, 200].map(t => { const w = t === 100 ? blueWin : !blueWin; return { teamId: t, win: w, objectives: { champion: { kills: ps.filter(p => p.teamId === t).reduce((a, p) => a + p.kills, 0) }, baron: { kills: aram ? 0 : w ? Math.floor(r() * 3) : Math.floor(r() * 1.4) }, dragon: { kills: aram ? 0 : w ? 2 + Math.floor(r() * 3) : Math.floor(r() * 3) }, tower: { kills: w ? 6 + Math.floor(r() * 5) : Math.floor(r() * 6) }, riftHerald: { kills: aram ? 0 : Math.floor(r() * 2) }, horde: { kills: aram ? 0 : Math.floor(r() * 4) } } }; });
    return { metadata: { matchId: id, participants: ps.map(p => p.puuid) }, info: { gameDuration: dur, gameEndTimestamp: end, gameStartTimestamp: end - dur * 1000, queueId: q, participants: ps, teams } };
  }

  return {
    profile(pf, name, tag) {

      const ti = Math.min(9, Math.floor(r() * 9.4)), mk = (qt, t) => ({ queueType: qt, tier: t, rank: APEX.includes(t) ? 'I' : pick(['I', 'II', 'III', 'IV'], r), leaguePoints: APEX.includes(t) ? Math.floor(r() * 900) : Math.floor(r() * 100), wins: 60 + Math.floor(r() * 220), losses: 50 + Math.floor(r() * 200), hotStreak: r() < .3 });
      const league = [mk('RANKED_SOLO_5x5', tl[ti])]; if (r() < .8) league.push(mk('RANKED_FLEX_SR', tl[Math.max(0, ti - 1 - Math.floor(r() * 2))]));
      const ch = shuffle(DD.champList, r).slice(0, 10);
      const puuid = `demo:${name}#${tag}`; mains[puuid] = ch.map(c => c.key);
      return delay({ account: { puuid, gameName: name, tagLine: tag }, summoner: { profileIconId: 1 + Math.floor(r() * 28), summonerLevel: 80 + Math.floor(r() * 600) }, league, mastery: ch.map((c, i) => ({ championId: +c.key, championLevel: Math.max(5, 46 - i * 4 - Math.floor(r() * 4)), championPoints: Math.floor(1100000 / (i + 1) * (.6 + r() * .6)) })), platform: pf });
    },

    },
    match(pf, id) { const [, h, i] = id.split('_'); return delay(genMatch(id, owner[id], +h, +i), 30 + Math.random() * 120); },
    live(pf, puuid) {
      const r = rng(hash(puuid) + Math.floor(Date.now() / 6e5)); if (r() < .35) { const e = new Error('현재 게임 중이 아닙니다.'); e.status = 404; return Promise.reject(e); }

    },

      const used = new Set(); const entries = Array.from({ length: 200 }, (_, i) => { let nm; do { nm = rname(r) } while (used.has(nm) && used.size < 2000); used.add(nm); const w = 150 + Math.floor(r() * 250); return { puuid: `demo:${nm}#${rtag(r)}`, leaguePoints: Math.round(base * (1 - i / 260) + r() * 20), wins: w, losses: Math.round(w * (.7 + r() * .3)), hotStreak: r() < .2 }; }).sort((a, b) => b.leaguePoints - a.leaguePoints);
      return delay({ tier: tier.toUpperCase(), queue, entries });
    },
    account(pf, puuid) { const [g, t] = split(puuid); return delay({ puuid, gameName: g, tagLine: t }, 40); },
    rotation() { const r = rng(Math.floor(Date.now() / 6048e5)); return delay({ freeChampionIds: shuffle(DD.champList, r).slice(0, 20).map(c => +c.key) }); },
  };
})();

async function loadMatches(reset, fresh) {
  if (P.loading) return; P.loading = true;
  const tok = P.token;

  try {
    const ids = await src().matchIds(P.pf, P.puuid, P.next, 20, P.queue, fresh);
    if (tok !== P.token) return;
    /* 매치가 도착하는 순서대로(앞에서부터 이어지는 만큼) 바로 화면에 표시 */
    const got = new Array(ids.length); let shown = 0, first = reset, timer = 0;
    const flush = (final) => {

      if (n === shown && !final) return;
      P.list.push(...got.slice(shown, n).filter(Boolean).map(m => analyze(m, P.puuid)).filter(Boolean)); shown = n;
      if (final) { P.next += ids.length; P.done = ids.length < 20; }
      renderMatches(first); first = false;
      if (!final) $('#more-wrap').innerHTML = '<div class="center" style="padding:14px"><div class="spin" style="width:22px;height:22px;border-width:2px"></div></div>';
    };
    const sched = () => { if (!timer) timer = setTimeout(() => { timer = 0; flush(false); }, 60); };
    await pool(ids.map((id, i) => [id, i]), async ([id, i]) => { let m = null; try { m = await src().match(P.pf, id); } catch { } got[i] = m || null; if (i === shown || i < 3) sched(); return m; }, isDemo ? 8 : 10);
    clearTimeout(timer); flush(true);
  } catch (e) {

function opScores(ps, dur) {
  const min = Math.max(1, dur / 60);

}

function analyze(m, puuid) {
  const info = m.info, ps = info.participants || [];
  const me = ps.find(p => p.puuid === puuid); if (!me) return null;
  const dur = info.gameEndTimestamp ? info.gameDuration : info.gameDuration / 1000;

  const arena = info.queueId === 1700 || info.queueId === 1710;

  const tk = ps.filter(p => tkey(p) === tkey(me)).reduce((a, p) => a + p.kills, 0);

}

  $('#side-champs').innerHTML = `<div class="card-h">챔피언 통계 <span class="sub">최근 ${valid.length}게임</span></div>` + (gc.length ? gc.map(c => { const cr = ratioOf(c.k, c.d, c.a); return `<div class="row" data-cf="${c.id}" data-tt="${esc(champName(c.id))}" data-tb="클릭하면 이 챔피언 게임만 볼 수 있어요">${cImg(c.id)}<div style="min-width:0"><div class="nm">${esc(champName(c.id))}</div><div class="s2">CS ${(c.cs / c.n).toFixed(0)} (${(c.cs / c.min).toFixed(1)})</div></div><div class="kd ${kcls(cr)}">${cr} 평점<small>${(c.k / c.n).toFixed(1)} / ${(c.d / c.n).toFixed(1)} / ${(c.a / c.n).toFixed(1)}</small></div><div class="wr ${pct(c.w, c.n) >= 60 ? 'wr-hi' : ''}">${pct(c.w, c.n)}%<small>${c.n}게임</small></div></div>`; }).join('') : '<div class="empty">데이터 없음</div>');
  // duo
  const duo = {};
  for (const a of valid) for (const p of a.ps) if (p.puuid !== P.puuid && (a.arena ? p.playerSubteamId === a.me.playerSubteamId : p.teamId === a.me.teamId)) { const x = (duo[p.puuid] ||= { n: 0, w: 0, name: pname(p), tag: ptag(p), c: p.championId }); x.n++; x.w += a.me.win ? 1 : 0; }
  const dl = Object.values(duo).filter(x => x.n >= 2).sort((a, b) => b.n - a.n).slice(0, 6);
  $('#side-duo').innerHTML = `<div class="card-h">함께 플레이한 소환사 <span class="sub">최근 ${valid.length}게임</span></div>` + (dl.length ? `<div class="row sub" style="font-size:11px;padding:8px 16px"><span>소환사</span><span class="c">게임</span><span class="w" style="font-weight:600">승률</span></div>` + dl.map(x => `<div class="row"><a href="${sumLink(P.pf, x.name, x.tag)}">${esc(x.name)} <span class="mute">#${esc(x.tag)}</span></a><span class="c">${x.n}</span><span class="w ${pct(x.w, x.n) >= 60 ? 'wr-hi' : ''}">${pct(x.w, x.n)}%</span></div>`).join('') : '<div class="empty">2회 이상 함께한 소환사가 없습니다.</div>');
  // match list
  const html = list.map(matchRow).join('');
  if (reset) $('#mlist').innerHTML = html || '<div class="card"><div class="empty big">최근 게임 기록이 없습니다.</div></div>';
  else $('#mlist').insertAdjacentHTML('beforeend', list.slice(list.length - (list.length - $$('#mlist .match').length)).map(matchRow).join(''));
  $('#more-wrap').innerHTML = P.done ? '' : '<button class="more" data-act="more">더 보기</button>';
  renderTitles(valid); applyCF();
}

function matchRow(a, idx) {
  const { m, me, ps, dur, remake, arena } = a;
  const cls = remake ? 'remake' : me.win ? 'win' : 'lose';
  const r = ratioOf(me.kills, me.deaths, me.assists);
  const min = dur / 60;
  const badges = [];
  if (me._b === 'MVP') badges.push('<span class="badge b-mvp">MVP</span>'); else if (me._b === 'ACE') badges.push('<span class="badge b-ace">ACE</span>');
  if (me.largestMultiKill >= 2) badges.push(`<span class="badge ${me.largestMultiKill === 5 ? 'b-penta' : 'b-multi'}">${MULTI[Math.min(5, me.largestMultiKill)]}</span>`);
  if (arena && me.placement) badges.push(`<span class="badge b-multi">${me.placement}등</span>`);
  const res = remake ? '다시하기' : arena ? `${me.placement || '-'}등` : me.win ? '승리' : '패배';
  let players = '';
  if (!arena) { const t1 = ps.filter(p => p.teamId === 100), t2 = ps.filter(p => p.teamId === 200); for (let i = 0; i < 5; i++) for (const p of [t1[i], t2[i]]) players += p ? `<div class="mp-row${p.puuid === P.puuid ? ' me' : ''}"><img src="${champImg(p.championId)}" loading="lazy" alt=""><a href="${sumLink(P.pf, pname(p), ptag(p))}" data-tt="${esc(pname(p))}#${esc(ptag(p))}">${esc(pname(p))}</a></div>` : '<div></div>'; }
  const tl = me._t || [], legend = tl.some(id => TBY[id][1] === 'leg');
  return `<div class="match ${cls}${legend ? ' legend' : ''}" data-cid="${me.championId}" data-mid="${esc(m.metadata.matchId)}" style="animation-delay:${Math.min(idx % 20, 10) * 25}ms">
    <div class="m-meta"><div class="q">${QUEUES[a.q] || '기타'}</div><div data-tt="${new Date(a.end).toLocaleString('ko-KR')}">${ago(a.end)}</div><hr><div class="res">${res}</div><div>${fmtDur(dur)}</div></div>
    <div class="m-main"><div class="m-top"><div class="mch">${cImg(me.championId)}<span>${me.champLevel}</span></div>${ssHTML(me)}
      <div class="kda"><div class="n">${me.kills}<i>/</i><span class="d">${me.deaths}</span><i>/</i>${me.assists}</div><div class="r ${kcls(r)}">${r}${r === 'Perfect' ? '' : ':1'} 평점</div></div>
      <div class="mstats"><div>킬관여 <b>${a.kp}%</b></div><div>CS <b>${a.cs}</b> (${(a.cs / min).toFixed(1)})</div><div>시야 <b>${me.visionScore}</b> · OP <b>${me._s.toFixed(1)}</b></div></div></div>
      ${titlesRow(tl)}
      <div class="m-bottom">${itemsHTML(me)}${badges.join('')}</div></div>
    <div class="m-players">${players}</div>
    <div class="m-exp">${ICON.chev}</div></div>`;
}

/* ---- match detail ---- */
function teamTable(a, list, tid, maxD, maxT, title) {
  const w = list[0]?.win;
  return `<table class="tt"><thead><tr><th class="${w ? 'w' : 'l'}">${title}</th><th>OP 스코어</th><th>KDA</th><th>피해량</th><th>골드</th><th>CS</th><th>시야</th><th>아이템</th></tr></thead><tbody>${list.map(p => {
    const r = ratioOf(p.kills, p.deaths, p.assists), cs = p.totalMinionsKilled + p.neutralMinionsKilled;
    const tag = p._b === 'MVP' ? '<em class="mvp">MVP</em>' : p._b === 'ACE' ? '<em class="ace">ACE</em>' : `<em>${p._r}위</em>`;
    return `<tr class="${p.puuid === P.puuid ? 'me' : p.win ? 'win' : 'lose'}"><td><div class="tp"><div class="mch">${cImg(p.championId)}<span>${p.champLevel}</span></div>${ssHTML(p)}<div style="min-width:0"><a class="nm" href="${sumLink(P.pf, pname(p), ptag(p))}" style="display:block">${esc(pname(p))}</a><div class="tg">#${esc(ptag(p))}</div>${p._t && p._t[0] ? titleChip(p._t[0], true) : ''}</div></div></td>
    <td><span class="score">${p._s.toFixed(1)} ${tag}</span></td>
    <td><b class="${kcls(r)}">${p.kills}/<span class="d">${p.deaths}</span>/${p.assists}</b><div class="mute" style="font-size:11px">${r}${r === 'Perfect' ? '' : ':1'}</div></td>
    <td class="dmg"><div class="v">${num(p.totalDamageDealtToChampions)} / <span class="mute">${num(p.totalDamageTaken)}</span></div><div class="bars"><div class="bar"><i style="width:${pct(p.totalDamageDealtToChampions, maxD)}%"></i></div><div class="bar t"><i style="width:${pct(p.totalDamageTaken, maxT)}%"></i></div></div></td>
    <td>${num(p.goldEarned)}</td><td>${cs}<div class="mute" style="font-size:11px">${(cs / (a.dur / 60)).toFixed(1)}/분</div></td>
    <td>${p.visionScore}<div class="mute" style="font-size:11px">${p.wardsPlaced ?? 0} / ${p.wardsKilled ?? 0} / ${p.detectorWardsPlaced ?? 0}</div></td>
    <td>${itemsHTML(p)}</td></tr>`;
  }).join('')}</tbody></table>`;
}
function cmpBar(lab, b, r) { const t = b + r || 1; return `<div class="cmp"><div class="track"><i class="b" style="width:${b / t * 100}%">${num(b)}</i><i class="r" style="width:${r / t * 100}%">${num(r)}</i></div></div><div class="cmp" style="margin-top:-2px;justify-content:center"><span class="lab">${lab}</span></div>`; }
function detailHTML(a, tab = 'all') {
  const { ps, m } = a;
  const maxD = Math.max(...ps.map(p => p.totalDamageDealtToChampions)), maxT = Math.max(...ps.map(p => p.totalDamageTaken));
  const tabs = `<div class="dtabs"><button class="dtab${tab === 'all' ? ' on' : ''}" data-dt="all">종합</button><button class="dtab${tab === 'ana' ? ' on' : ''}" data-dt="ana">팀 분석</button><button class="dtab${tab === 'build' ? ' on' : ''}" data-dt="build">내 빌드</button></div>`;
  if (a.arena) {
    const groups = {}; ps.forEach(p => (groups[p.playerSubteamId] ||= []).push(p));
    return tabs + Object.values(groups).sort((x, y) => (x[0].placement || 9) - (y[0].placement || 9)).map(g => teamTable(a, g, 0, maxD, maxT, `${g[0].placement || '-'}등`)).join('');
  }
  const my = a.me.teamId, order = [my, my === 100 ? 200 : 100];
  const T = id => ps.filter(p => p.teamId === id);
  const tm = id => m.info.teams?.find(t => t.teamId === id)?.objectives || {};
  const sum = (id, f) => T(id).reduce((s, p) => s + (f(p) || 0), 0);
  if (tab === 'ana') {
    const stat = [['챔피언 처치', p => p.kills], ['골드 획득', p => p.goldEarned], ['가한 피해량', p => p.totalDamageDealtToChampions], ['받은 피해량', p => p.totalDamageTaken], ['와드 설치', p => p.wardsPlaced], ['CS', p => p.totalMinionsKilled + p.neutralMinionsKilled]];
    const hbox = (lab, f) => { const mx = Math.max(1, ...ps.map(f)); return `<div class="box"><h4>${lab}</h4>${[...ps].sort((x, y) => f(y) - f(x)).map(p => `<div class="hb">${cImg(p.championId)}<div class="track"><i style="width:${pct(f(p), mx)}%;background:${p.teamId === 100 ? 'var(--win)' : 'var(--lose)'}"></i></div><div class="v">${num(f(p))}</div></div>`).join('')}</div>`; };
    return tabs + `<div class="ana"><div class="box"><h4>팀 비교 (블루 vs 레드)</h4>${stat.map(([l, f]) => cmpBar(l, sum(100, f), sum(200, f))).join('')}</div>${hbox('가한 피해량', p => p.totalDamageDealtToChampions)}${hbox('골드 획득', p => p.goldEarned)}${hbox('받은 피해량', p => p.totalDamageTaken)}</div>`;
  }
  if (tab === 'build') {
    const me = a.me, pr = me.perks?.styles || [];
    const runes = pr.flatMap(s => (s.selections || []).map(x => x.perk));
    return tabs + `<div class="ana"><div class="box"><h4>최종 아이템</h4><div style="transform:scale(1.4);transform-origin:left top;height:44px">${itemsHTML(me)}</div><h4 style="margin-top:6px">소환사 주문</h4><div style="display:flex;gap:6px">${[me.summoner1Id, me.summoner2Id].map(id => `<div style="width:36px">${spellImg(id).replace('<img', '<img style="width:36px;height:36px;border-radius:8px"')}</div>`).join('')}</div></div>
      <div class="box"><h4>룬</h4><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${runes.length ? runes.map((id, i) => runeImg(id, '').replace('<img', `<img style="width:${i === 0 ? 48 : 32}px;height:${i === 0 ? 48 : 32}px;border-radius:50%;background:#0008;padding:2px"`)).join('') : runeImg(pr[0]?.selections?.[0]?.perk, '').replace('<img', '<img style="width:48px;height:48px"') + runeImg(pr[1]?.style, '').replace('<img', '<img style="width:28px;height:28px"')}</div><div class="mute" style="margin-top:10px;font-size:12px">${esc(DD.runes[pr[0]?.style]?.name || '')} + ${esc(DD.runes[pr[1]?.style]?.name || '')}</div></div></div>`;
  }
  const objSide = id => { const o = tm(id); return `<div class="side"><span data-tt="바론">${ICON.baron}<b>${o.baron?.kills ?? 0}</b></span><span data-tt="드래곤">${ICON.dragon}<b>${o.dragon?.kills ?? 0}</b></span><span data-tt="포탑">${ICON.tower}<b>${o.tower?.kills ?? 0}</b></span></div>`; };
  const k1 = sum(order[0], p => p.kills), k2 = sum(order[1], p => p.kills), g1 = sum(order[0], p => p.goldEarned), g2 = sum(order[1], p => p.goldEarned);
  const tname = id => `${T(id)[0]?.win ? '승리' : '패배'} (${id === 100 ? '블루팀' : '레드팀'})`;
  return tabs + teamTable(a, T(order[0]), order[0], maxD, maxT, tname(order[0])) +
    `<div class="obj">${objSide(order[0])}<div class="mid"><div class="cmp"><span class="lab">킬</span><div class="track"><i class="b" style="width:${k1 / (k1 + k2 || 1) * 100}%;${order[0] === 200 ? 'background:var(--lose)' : ''}">${k1}</i><i class="r" style="width:${k2 / (k1 + k2 || 1) * 100}%;${order[1] === 100 ? 'background:var(--win)' : ''}">${k2}</i></div></div><div class="cmp"><span class="lab">골드</span><div class="track"><i class="b" style="width:${g1 / (g1 + g2 || 1) * 100}%;${order[0] === 200 ? 'background:var(--lose)' : ''}">${num(g1)}</i><i class="r" style="width:${g2 / (g1 + g2 || 1) * 100}%;${order[1] === 100 ? 'background:var(--win)' : ''}">${num(g2)}</i></div></div></div>${objSide(order[1])}</div>` +
    teamTable(a, T(order[1]), order[1], maxD, maxT, tname(order[1]));
}

      <div class="bans">밴 ${(g.bannedChampions || []).filter(b => b.teamId === id && b.championId > 0).map(b => `<img src="${champImg(b.championId)}" alt="">`).join('') || '-'}</div></div>`;

async function renderRanking(pf) {

    const c = tierColor(d.tier);
    const rows = d.entries.slice(0, 100);
    $('#rk-body').innerHTML = rows.length ? `<table class="rk"><thead><tr><th>순위</th><th>소환사</th><th>티어</th><th>LP</th><th>승률</th></tr></thead><tbody>${rows.map((e, i) => { const g = e.wins + e.losses, wr = pct(e.wins, g); return `<tr><td class="no">${i + 1}</td><td class="who" data-pu="${esc(e.puuid)}"><span class="mute">불러오는 중...</span></td><td style="color:${c};font-weight:800">${TIERS[d.tier]?.[0] || d.tier}</td><td class="lp">${num(e.leaguePoints)} LP</td><td><div class="wrbar"><div class="track"><i class="w" style="width:${wr}%">${e.wins}W</i><i class="l">${e.losses}L</i></div><b class="${wr >= 60 ? 'wr-hi' : ''}">${wr}%</b></div></td></tr>`; }).join('')}</tbody></table>` : '<div class="empty big">랭킹 데이터가 없습니다.</div>';
    const cells = $$('#rk-body .who');
    await pool(cells, async cell => {
      if (RK.tok !== tok) return;
      const pu = cell.dataset.pu; let a = nameCache[pu];
      if (!a) { a = await src().account(pf, pu); nameCache[pu] = a; }
      cell.innerHTML = `<a href="${sumLink(pf, a.gameName, a.tagLine)}">${esc(a.gameName)}</a><span class="tg">#${esc(a.tagLine)}</span>`;
    }, isDemo ? 10 : 3);
  } catch (e) { if (RK.tok === tok) $('#rk-body').innerHTML = `<div class="empty big">${esc(e.message)}${!isDemo ? '' : ''}</div>`; }
}

/* ---- error ---- */
function renderError(e, pf, name, tag) {
  const keyIssue = e.status === 401 || e.status === 403;
  app.innerHTML = `<div class="card err"><div class="ic">!</div><h2>${e.status === 404 ? '소환사를 찾을 수 없어요' : keyIssue ? 'API 키 확인이 필요해요' : '불러오지 못했어요'}</h2><p>${esc(e.message)}</p><div class="acts">
    ${keyIssue ? '<button class="btn primary" data-act="settings">API 키 설정</button>' : ''}
    <button class="btn" data-act="retry">다시 시도</button>
    <a class="btn gold" href="#/demo/${pf}/${enc(name)}-${enc(tag)}">데모로 보기</a></div></div>`;
}

/* ================= events ================= */
document.addEventListener('click', async e => {
  const t = e.target;
  const del = t.closest('[data-del]');
  if (del) { e.preventDefault(); e.stopPropagation(); const k = del.dataset.del; LS.set(k, LS.get(k, []).filter(r => r.pf + '|' + r.name + '|' + r.tag !== del.dataset.key)); renderHome(); return; }
  const act = t.closest('[data-act]')?.dataset.act;
  if (act === 'close') return closeModal();
  if (act === 'close-nav') return closeModal();
  if (act === 'settings' || t.closest('#btn-settings')) return openSettings();
  if (act === 'retry') return route();
  if (act === 'key-eye') { const i = $('#key-in'); i.type = i.type === 'password' ? 'text' : 'password'; return; }
  if (act === 'key-clear') { LS.set('key', ''); $('#key-in').value = ''; $('#key-msg').className = 'msg'; $('#key-msg').textContent = '삭제했습니다.'; return; }
  if (act === 'owner-save') {
    const v = $('#owner-in').value.trim(); LS.set('owner', v); const m = $('#key-msg');
    await KeyUI.refresh(true);
    if (IS_LOCAL) { m.className = 'msg ok'; m.textContent = v ? '저장했어요. 이제 이 PC에서 적용한 키가 공개 주소에도 함께 적용돼요.' : '소유자 코드를 지웠어요.'; const r = await fetch('/api/key-sync', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ owner: v }) }).then(x => x.json()).catch(() => ({ error: '로컬 서버 연결 실패' })); if (v && r.error) { m.className = 'msg bad'; m.textContent = r.error; } return; }
    if (SRV && SRV.owner) { m.className = 'msg ok'; m.textContent = '운영자 인증 완료! 이제 이 주소에서도 새 키를 적용할 수 있어요.'; } else { m.className = 'msg bad'; m.textContent = '소유자 코드가 올바르지 않습니다.'; }
    return;
  }
  if (act === 'key-save') {
    const v = $('#key-in').value.trim(); const m = $('#key-msg');
    if (!v) { m.className = 'msg bad'; m.textContent = 'API 키를 입력해 주세요. (RGAPI-로 시작)'; $('#key-in').focus(); return; }
    if (!/^RGAPI-[0-9a-f-]{36}$/i.test(v)) { m.className = 'msg bad'; m.textContent = '키 형식이 올바르지 않습니다. RGAPI-xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx 형태인지 확인하세요.'; return; }
    m.className = 'msg'; m.textContent = '새 키 확인 중… 갓 발급한 키는 활성화까지 최대 1분 걸려요.';
    const r = await KeyUI.apply(v);
    m.className = 'msg ' + (r.ok ? 'ok' : 'bad'); m.textContent = r.ok ? '적용 완료! 이제 실제 전적 조회가 가능합니다.' : r.error;
    if (r.ok) $('#key-in').value = '';
    return;
  }
  if (act === 'refresh') { const b = t.closest('button'); b.disabled = true; b.innerHTML = ICON.refresh + ' 갱신 중...'; await renderProfile(P.pf, P.data.account.gameName, P.data.account.tagLine, true); toast('전적을 갱신했습니다.'); return; }
  if (act === 'live') return openLive();
  if (act === 'fav') {
    let fav = LS.get('favs', []); const a = P.data.account; const solo = P.data.league.find(x => x.queueType === 'RANKED_SOLO_5x5');
    if (isFav()) { fav = fav.filter(r => !(r.pf === P.pf && r.name === a.gameName && r.tag === a.tagLine)); toast('즐겨찾기에서 제거했습니다.'); }
    else { fav.unshift({ pf: P.pf, name: a.gameName, tag: a.tagLine, icon: P.data.summoner.profileIconId, tier: tierText(solo), demo: isDemo }); toast('즐겨찾기에 추가했습니다.'); }
    LS.set('favs', fav.slice(0, 12)); const b = t.closest('button'); b.classList.toggle('on', isFav()); b.innerHTML = ICON.star(isFav()); return;
  }
  if (act === 'share') { const u = location.href; try { await navigator.clipboard.writeText(u); toast('프로필 링크를 복사했어요.'); } catch { toast(u); } return; }
  if (act === 'cf-clear') { P.champ = ''; return applyCF(); }
  const cf = t.closest('#side-champs .row[data-cf]'); if (cf) { P.champ = P.champ === cf.dataset.cf ? '' : cf.dataset.cf; applyCF(); if (P.champ) $('#cf-bar').scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  if (act === 'more') return loadMatches(false);
  const qt = t.closest('.qtab');
  if (qt) { $$('.qtab').forEach(x => x.classList.toggle('on', x === qt)); P.queue = qt.dataset.q; P.loading = false; P.token = Symbol(); const tok = P.token; $('#sum-body').innerHTML = '<div class="center"><div class="spin"></div></div>'; P.token = tok; return loadMatches(true); }
  const dt = t.closest('[data-dt]');
  if (dt) { const det = dt.closest('.m-detail'); const a = P.list.find(x => x.m.metadata.matchId === det.dataset.for); det.innerHTML = detailHTML(a, dt.dataset.dt); return; }
  const rq = t.closest('[data-rq]'); if (rq) { RK.queue = rq.dataset.rq; return renderRanking(curPf); }
  const rt = t.closest('[data-rt]'); if (rt) { RK.tier = rt.dataset.rt; return renderRanking(curPf); }
  const row = t.closest('.match');
  if (row && !t.closest('a')) {
    const id = row.dataset.mid, nx = row.nextElementSibling;
    if (nx && nx.classList.contains('m-detail')) { nx.remove(); row.classList.remove('open'); return; }
    const a = P.list.find(x => x.m.metadata.matchId === id); if (!a) return;
    row.classList.add('open');
    row.insertAdjacentHTML('afterend', `<div class="m-detail" data-for="${esc(id)}">${detailHTML(a)}</div>`);
  }
});
document.addEventListener('change', e => { if (e.target.id === 'rk-pf') { location.hash = '#/ranking/' + e.target.value; } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { const i = $('.sform input'); if (i && i.offsetParent) { e.preventDefault(); i.focus(); } } });
setInterval(() => { const u = $('#upd'); if (u && P.updated) { const s = (Date.now() - P.updated) / 1000; u.textContent = '최근 업데이트: ' + (s < 60 ? '방금 전' : ago(P.updated)); } }, 30000);

// tooltip
const tip = $('#tip');
document.addEventListener('mouseover', e => { const el = e.target.closest('[data-tt]'); if (!el) { tip.classList.remove('on'); return; } tip.innerHTML = `<b>${esc(el.dataset.tt)}</b>${el.dataset.tb ? esc(el.dataset.tb) : ''}`; tip.classList.add('on'); });
document.addEventListener('mousemove', e => { if (!tip.classList.contains('on')) return; const w = tip.offsetWidth, h = tip.offsetHeight; let x = e.clientX + 14, y = e.clientY + 16; if (x + w > innerWidth - 8) x = e.clientX - w - 14; if (y + h > innerHeight - 8) y = e.clientY - h - 12; tip.style.left = x + 'px'; tip.style.top = y + 'px'; });

/* ================= boot ================= */
(async () => {
  app.innerHTML = '<div class="center" style="padding-top:30vh"><div class="spin"></div><div class="sub" style="margin-top:14px">게임 데이터 불러오는 중...</div></div>';
  try { await Promise.all([loadDD(), checkServer()]); KeyUI.init(); }
  catch { app.innerHTML = '<div class="card err"><div class="ic">!</div><h2>게임 데이터를 불러오지 못했어요</h2><p>인터넷 연결을 확인한 뒤 새로고침하세요.</p></div>'; return; }
  route();
})();
</script>
</body>
</html>
